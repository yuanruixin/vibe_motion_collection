<title>天青色等烟雨 · 江南彩墨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #1d2b33 0%, #0e161b 70%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
  }

  /* ===== 9:16 舞台 ===== */
  .stage {
    position: relative;
    height: min(96vh, 170.6vw);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    background: linear-gradient(180deg,
      #cfe3e8 0%,   /* 天青色 */
      #b8d4d6 22%,
      #9fc2c2 45%,
      #7fa8a6 62%,
      #5f8a88 78%,
      #4a7472 100%);
  }

  /* 宣纸肌理 */
  .paper {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: .5; mix-blend-mode: overlay;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 3px);
  }

  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ===== 月色光晕 ===== */
  .moon-glow {
    animation: moonBreath 7s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes moonBreath {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.06); }
  }

  /* ===== 云雾流动 ===== */
  .mist { animation: mistDrift 26s linear infinite; }
  .mist.m2 { animation-duration: 38s; animation-direction: reverse; opacity: .6; }
  .mist.m3 { animation-duration: 50s; opacity: .45; }
  @keyframes mistDrift {
    from { transform: translateX(-12%); }
    to   { transform: translateX(12%); }
  }

  /* ===== 远山呼吸 ===== */
  .mountain-far { animation: mountainFloat 14s ease-in-out infinite; }
  @keyframes mountainFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(4px); }
  }

  /* ===== 炊烟袅袅 ===== */
  .smoke { animation: smokeRise 9s ease-in infinite; opacity: 0; transform-origin: center bottom; }
  .smoke.s2 { animation-delay: 3s; }
  .smoke.s3 { animation-delay: 6s; }
  @keyframes smokeRise {
    0%   { transform: translateY(0) scale(.6) rotate(0deg); opacity: 0; }
    15%  { opacity: .55; }
    60%  { opacity: .35; }
    100% { transform: translateY(-190px) scale(2.4) rotate(14deg); opacity: 0; }
  }

  /* ===== 小船摇曳 ===== */
  .boat { animation: boatBob 5.5s ease-in-out infinite; transform-origin: center; }
  @keyframes boatBob {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-5px) rotate(1.2deg); }
  }

  /* ===== 荷叶轻摆 ===== */
  .lotus { animation: lotusSway 8s ease-in-out infinite; transform-origin: center bottom; }
  .lotus.l2 { animation-delay: -3s; animation-duration: 9.5s; }
  @keyframes lotusSway {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%      { transform: rotate(2.5deg) translateY(-4px); }
  }

  /* ===== 彩墨晕染脉动 ===== */
  .splash { animation: splashPulse 10s ease-in-out infinite; transform-origin: center; mix-blend-mode: multiply; }
  .splash.sp2 { animation-delay: -3.3s; }
  .splash.sp3 { animation-delay: -6.6s; }
  @keyframes splashPulse {
    0%, 100% { opacity: .35; transform: scale(1); }
    50%      { opacity: .55; transform: scale(1.15); }
  }

  /* ===== 雨丝 ===== */
  .rain { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  .drop {
    position: absolute; top: -12%;
    width: 1px; height: 9%;
    background: linear-gradient(180deg, transparent, rgba(230, 245, 248, .55));
    animation: rainFall linear infinite;
  }
  @keyframes rainFall {
    to { transform: translateY(1250%); }
  }

  /* ===== 涟漪 ===== */
  .ripples { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .ripple {
    position: absolute;
    border: 1.5px solid rgba(235, 250, 252, .5);
    border-radius: 50%;
    animation: rippleGrow 5s ease-out infinite;
    opacity: 0;
  }
  @keyframes rippleGrow {
    0%   { transform: scale(.15); opacity: .65; }
    80%  { opacity: .12; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* ===== 歌词 ===== */
  .lyric {
    position: absolute; z-index: 8;
    top: 11%; right: 9%;
    writing-mode: vertical-rl;
    letter-spacing: .42em;
    font-size: clamp(16px, 3.4vmin, 26px);
    color: #274b4e;
    text-shadow: 0 1px 8px rgba(255,255,255,.55);
    opacity: 0;
    animation: lyricFade 16s ease-in-out infinite;
  }
  .lyric span { display: block; margin-left: .9em; }
  .lyric.ly2 { animation-delay: 4s; }
  .lyric.ly3 { animation-delay: 8s; }
  .lyric.ly4 { animation-delay: 12s; }
  @keyframes lyricFade {
    0%, 100% { opacity: 0; transform: translateY(10px); filter: blur(4px); }
    8%, 22%  { opacity: 1; transform: translateY(0);   filter: blur(0); }
    30%      { opacity: 0; transform: translateY(-10px); filter: blur(4px); }
  }

  /* ===== 印章 ===== */
  .seal {
    position: absolute; z-index: 8;
    left: 7%; top: 6%;
    width: clamp(34px, 7vmin, 52px); height: clamp(34px, 7vmin, 52px);
    background: #b23a3a;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #f5e9e0;
    font-size: clamp(12px, 2.4vmin, 17px);
    writing-mode: vertical-rl;
    letter-spacing: .15em;
    box-shadow: inset 0 0 0 2px rgba(245,233,224,.75), 0 4px 12px rgba(0,0,0,.2);
    opacity: .88;
    transform: rotate(-3deg);
    animation: sealIn 2s ease-out 1s both;
  }
  @keyframes sealIn {
    from { opacity: 0; transform: rotate(-3deg) scale(1.6); filter: blur(6px); }
    to   { opacity: .88; transform: rotate(-3deg) scale(1); filter: blur(0); }
  }

  /* 题款 */
  .title-ink {
    position: absolute; z-index: 8;
    left: 7%; bottom: 7%;
    writing-mode: vertical-rl;
    letter-spacing: .3em;
    font-size: clamp(13px, 2.6vmin, 19px);
    color: rgba(240, 250, 250, .85);
    text-shadow: 0 1px 6px rgba(20,50,50,.6);
    animation: titleIn 3s ease-out .5s both;
  }
  @keyframes titleIn {
    from { opacity: 0; transform: translateY(16px); filter: blur(5px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
</style>

<script>
  // 生成雨丝
  const rain = document.getElementById('rain');
  for (let i = 0; i < 90; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.animationDuration = (1.4 + Math.random() * 1.6) + 's';
    d.style.animationDelay = (-Math.random() * 3) + 's';
    d.style.opacity = .25 + Math.random() * .5;
    rain.appendChild(d);
  }

  // 生成水面涟漪（下半部水面区域）
  const rip = document.getElementById('ripples');
  for (let i = 0; i < 14; i++) {
    const r = document.createElement('div');
    r.className = 'ripple';
    const size = 24 + Math.random() * 60;
    r.style.width = size + 'px';
    r.style.height = size / 2.6 + 'px';
    r.style.left = (4 + Math.random() * 88) + '%';
    r.style.top = (52 + Math.random() * 40) + '%';
    r.style.animationDuration = (3.5 + Math.random() * 3) + 's';
    r.style.animationDelay = (-Math.random() * 6) + 's';
    rip.appendChild(r);
  }
